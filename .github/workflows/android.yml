name: Build Android App Bundle

# Builds a signed .aab you can upload straight to Play Console.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      base64 of your upload-keystore.jks
#   KEYSTORE_PASSWORD    the store password
#   KEY_ALIAS            the key alias (e.g. upload)
#   KEY_PASSWORD         the key password
# Without those secrets the job still runs and produces an UNSIGNED bundle,
# which is useful for checking the build compiles.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode to build (must be higher than the last upload)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Bump versionCode
        if: github.event.inputs.versionCode != ''
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.versionCode }}/" android/app/build.gradle

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: piano-rush-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties
