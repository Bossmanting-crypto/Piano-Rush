name: Build Android App Bundle

# Produces two artifacts:
#   piano-rush-aab  -> app-release.aab, the file Play Console accepts
#   piano-rush-apk  -> app-debug.apk, sideload to a phone for a quick look
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the bundle builds unsigned, which Play will reject.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (must exceed the last upload)'
        required: false

jobs:
  build:
    # Pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19 and broke SDK setup.
    # ubuntu-24.04 ships with the Android SDK already installed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Capacitor 8 requires Node 22+
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets
        run: npx cap sync android

      - name: Bump versionCode
        if: github.event.inputs.versionCode != ''
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.versionCode }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. Building UNSIGNED — Play will reject this bundle."
            exit 0
          fi
          # Strip spaces/CR/newlines that sneak in when pasting into the GitHub UI
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          echo "::notice::KEYSTORE_BASE64 received: ${#CLEAN} chars, starts ${CLEAN:0:8}, ends ${CLEAN: -8}"
          if ! printf '%s' "$CLEAN" | base64 -di > android/upload-keystore.jks 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (${#CLEAN} chars). Delete the secret and paste the value again."
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore decoded ($(stat -c%s android/upload-keystore.jks) bytes) but could not be opened with KEYSTORE_PASSWORD / KEY_ALIAS. Re-check those two secrets."
            exit 1
          fi
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          echo "Keystore written ($(stat -c%s android/upload-keystore.jks) bytes)"

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Report signing state
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Bundle: $AAB ($(du -h "$AAB" | cut -f1))"
          if unzip -l "$AAB" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC"; then
            echo "Signed — ready to upload to Play Console."
          else
            echo "::warning::Bundle is UNSIGNED. Add the four keystore secrets and re-run."
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: piano-rush-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-rush-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Clean up signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties
