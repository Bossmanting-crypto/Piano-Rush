name: Create upload keystore (run once)

# Generates the app signing key inside your own GitHub account, so no JDK or
# Android Studio is needed locally. Run this ONCE, download the artifact, and
# back it up — losing it means the app can never be updated again.
#
# Before running:
#   1. The repository must be PRIVATE. Artifacts on a public repo can be
#      downloaded by anyone, and this artifact contains your signing key.
#   2. Add a repository secret KEYSTORE_PASSWORD with the password you want.
#      It is read from the secret so it is never typed into a form or written
#      to the run log.
#
# The run log never prints the key or the password.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to confirm'
        required: true
      alias:
        description: 'Key alias'
        required: true
        default: 'upload'
      org:
        description: 'Organisation / your name (goes in the certificate)'
        required: true
        default: 'Piano Rush'
      country:
        description: 'Two-letter country code'
        required: true
        default: 'KE'

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: Preflight
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          fail=0
          if [ "${{ github.event.inputs.confirm }}" != "CREATE" ]; then
            echo "::error::Type CREATE in the confirm box to run this."; fail=1
          fi
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::This repository is PUBLIC. Anyone can download workflow artifacts from a public repo, and this one would contain your signing key. Make the repository private (Settings > General > Danger Zone), then re-run."; fail=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add a repository secret named KEYSTORE_PASSWORD first (Settings > Secrets and variables > Actions)."; fail=1
          elif [ ${#KEYSTORE_PASSWORD} -lt 6 ]; then
            echo "::error::KEYSTORE_PASSWORD must be at least 6 characters — keytool rejects shorter ones."; fail=1
          fi
          exit $fail

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ github.event.inputs.alias }}
          ORG: ${{ github.event.inputs.org }}
          COUNTRY: ${{ github.event.inputs.country }}
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/upload-keystore.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=$ORG, OU=Mobile, O=$ORG, L=Nairobi, ST=Nairobi, C=$COUNTRY"
          # PKCS12 uses one password for store and key, so KEY_PASSWORD == KEYSTORE_PASSWORD.
          base64 -w0 out/upload-keystore.jks > out/KEYSTORE_BASE64.txt
          echo "$ALIAS" > out/KEY_ALIAS.txt

      - name: Verify it opens
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          keytool -list -keystore out/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" \
            | grep -i "fingerprint" || true
          echo "Keystore is valid. Base64 is $(wc -c < out/KEYSTORE_BASE64.txt) characters."

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-KEEP-THIS
          path: out/
          retention-days: 1
          if-no-files-found: error

      - name: What to do next
        run: |
          echo "::notice::Download the 'upload-keystore-KEEP-THIS' artifact from this run NOW — it is deleted in 1 day."
          echo "::notice::Back up upload-keystore.jks and your password somewhere permanent. Without them the app can never be updated."
          echo "::notice::Then add two more secrets: KEYSTORE_BASE64 (paste the contents of KEYSTORE_BASE64.txt) and KEY_ALIAS (the contents of KEY_ALIAS.txt)."
          echo "::notice::KEY_PASSWORD is not needed — this keystore uses the same password for both."
